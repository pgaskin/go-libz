name: Attest libz build

on:
  push:
    branches:
      - master
    paths:
      - internal/libz_wasm/libz*.go
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: go generate ./internal/libz_wasm
      - run: git diff --exit-code # ensure the build was reproducible
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            internal/libz_wasm/libz.go
            internal/libz_wasm/libz_big.go
